name: Check submission

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check team folder
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check-submission.sh "origin/$BASE_REF"
